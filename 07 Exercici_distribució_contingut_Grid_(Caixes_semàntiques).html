<!DOCTYPE html>
<html lang="ES">
<head>
    <meta charset="UTF-8"/>

    <title>Example d'ús del Grid (Taula)</title>

    <style>
        /* "Header" i "Footer" amb mateix format (sense repetir codi) */
        
        header, footer{
            text-align: center;
        }
        /*Declarar etiquetes (Exp: "headerG")*/
        header{
            grid-area: headerG;
            background-color: gray;
            border: 8px solid;
        }
        main{
            display: grid;
            height: 650px;
            grid-area: mainG; 
            background-color: maroon;
            text-align: center;
            border: 8px solid;
            
            width: 50%;

        }

        aside{
            grid-area:asideG; 
            background-color: green;
            text-align: center;
            border: 8px solid;

            width: 25%;
        }

        
        footer{grid-area: footerG;
            background-color: blue;
            border: 8px solid;
        }

        article{
            grid-area: sectionG;
            background-color: purple;
            color: wheat;
            text-align: center;
            border: 3px solid black;
            margin: 2%;
        }

        .menu{
            grid-area: menuG;
            background-color: goldenrod;
            border: 5px solid;
            text-align: center;
            
            width: 25%;

        }


        /*Declarar etiquetes */

        /*grid Alternatiu*/
        .gridArticle{
            display: grid;
            /*Medida de columnes*/

            /*flex dels articles*/
            display: flex;
            flex-direction: row;
            justify-content: space-around;

        }

        section{
            
            background-color: cyan;
            border: 4px solid black;
            margin: 2%;
            width: 40%; 

        }


        .div-CenterFlex{
            display: flex;
            flex-direction: row;
            align-items: stretch;
        }
        
    </style>
</head>


<body> <!--display grid en contenidor (body)-->

    <header>
        <h1>Capçalera</h1>
    </header>
    
    <div class="div-CenterFlex">
    
        
        <div class="menu">
            <h2>MENÚ</h2>
        </div>
        

        
        <main>
            <h1>Principal</h1>
            <!--Article amb grid-->
            
            <div class="gridArticle">
                <section> <!--Section 1-->
                    <h2>Secció 1</h2>
                    <article><h3>Article 1</h3></article>
                    <article><h3>Article 2</h3></article>
                    <h4>
                        
                    </h4>
                </section>
                
                <section> <!--Section 2-->
                    <h2>Secció 2</h2>
                    <article><h3>Article 1</h3></article>
                <article><h3>Article 2</h3></article>
                <h4>
                    
                </h4>
            </section>
         </div>
        </main>
        <aside> <h2>ASIDE</h2></aside>     
    </div>
    

    <footer><h2>Peu</h2></footer>

</body> <!--display grid en contenidor (body)-->
</html>
