    <!-- BOOTstrap -->

<body id="body">
    <header>
        <h1>// 68 Validació de dades (storage)</h1>
        <select name="darktheme" id="tema">
            <option value="light">Light<i class="fa-regular fa-sun"></i></option>
            <option value="dark">Dark<i class="fa-solid fa-moon"></i></option>
        </select>
        <i class="fa-regular fa-sun" style="color: wheat; font-size: 2rem;"></i>|||||<i class="fa-solid fa-moon" style="color: wheat; font-size: 2rem;"></i>
    </header>

    <nav>
        <button id="btnNateja">Esborra Local Storage</button>
    </nav>

     <main>

    <!-- Validació de dades (Utilitzant storage) -->
     <!-- USUARI I PASSWORD (INICI DE SESSIÓ) -->
    <h3>Validació d'Inici de Sessió:</h3>
            <div class="caixaValidar">
            <!-- <form action="" method="post"> -->

                <table>
                    <!-- Usuari i contrasenya: -->
                    <tr>
                        <td>
                            <label for="username">Usuari:</label>
                        </td>
                        <td>
                            <input type="text" name="nom" id="username">
                        </td>
                        <td>
                            <div id="mUsername" class="alert"></div>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="">Contrasenya:</label>
                        </td>
                        <td>               
                            <input type="password" name="nom" id="password" minlength="8" maxlength="24">
                        </td>
                        <td>
                            <div id="mPassword" class="alert"></div>
                        </td>
                    </tr>
                    <!-- Botóns del formulari: -->
                    <tr>
                        <td>
                            <button id="btnIniciSessio" type="submit">Inici sessió</button>     
                        </td>
                        <td>
                            <button id="btnNatejaDades">Nateja dades</button>     
                        </td>
                        <td>
                            <button id="btnNouUsuari">Registrar nou usuari</button>     
                        </td>
                    </tr>
                    <!-- Mostrar errors o missatges aqui: -->
                    <tr>
                        <td colspan="3" class="alert"><p><b id="missatgeValUsuari"></b></p></td>
                    </tr>
                </table>
            </div>
        <!-- </form> -->
        <!--  -->
    </div>

    
</main>
