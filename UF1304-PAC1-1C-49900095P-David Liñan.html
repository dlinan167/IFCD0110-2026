<body>
    <header>
        <figure>
            <img src="https://borsa.cetpenedes.cat/wp-content/uploads/2022/06/logo-alta-calidad_Mesa-de-trabajo-1.png" alt="logo CET Penedes">
        </figure>

    <nav>
        <ul>
            <li>Opció 1</li>
            <li>Opció 2</li>

            <li>Opció 4</li>
        </ul>
    </nav>
    <main>
    <!-- =========== TARJETA DE INICI SESSIÓ =========== -->
    <div class="fila">
        <div class="tarjeta-formulari">
            <div class="div-registre" id="log-in">
                <figure>
                    <img src="https://cdn-icons-png.flaticon.com/512/326/326850.png" alt="tecla de Registre">
                </figure>
                <form action="./UF1304-PAC1-1C-49900095P-David Liñan(PAGINA 2 FORMULARI D'INSCRIPCIÓ).html" method="get" target="_blank">
                    
                    <div class="fila">
                        <!-- EMAIL -->
                        <div class="fila">
                            <label for="USUARI-Email"><b>Usuari</b></label>
                            <input type="email" placeholder="Exemple@gmail.com" name="USUARI-Email" required/>
                        </div>
                        <!-- CONTRASENYA -->
                        <div class="fila"> 
                            <label for="CONTRASENYA"><b>Contrasenya</b></label>
                            <input type="password" placeholder="Entra la teva contrasenya" name="CONTRASENYA" required minlength="8" maxlength="12"/>
                        </div>
                        <!-- BUTTONS DEL FORM -->
                        <button type="submit" value="submit" id="btnSubmit">SUBMIT <br>(Enviar)</button>
                        <label>
                            <input type="checkbox" checked="checked" name="RECORDAR-ME"/> Recordar-me
                        </label>
                    </div> 
                    <div class="fila" style="background-color:#f1f1f1">
                        <button type="reset" class="btnCancelar">Natejar camps!</button>
                        <span class="CONTRASENYA">Has perdut la teva <a href="#">contrasenya?</a></span>
                    </div>
                </form> 
            </div>
        </div>
    </div>
    </main>

    <aside>BANNERS</aside>
    <footer>Fet per David</footer>
