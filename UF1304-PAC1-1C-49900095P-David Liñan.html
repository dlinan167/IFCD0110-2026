<body>
    <header>
    <h1>CET Penedes</h1>
    </header>
    <nav>
        <ul>
            <li>Opció 1</li>
            <li>Opció 2</li>
            <li>Opció 3</li>
            <li>Opció 4</li>
        </ul>
    </nav>
    <main>
        <div class="tarjeta-login">
            <div class="div-registre" id="log-in">
                <figure>
                    <img src="https://cdn.pixabay.com/photo/2014/02/04/13/17/register-257986_1280.jpg" alt="tecla de Registre">
                </figure>
                <form action="https://www.google.com" method="get" target="_blank">
                    
                    <div class="fila">     
                        <div class="fila">
                            <label for="USUARI"><b>Usuari</b></label>
                            <input type="text" placeholder="Entra el teu cognom" name="USUARI" required/>
                        </div>
                        <div class="fila"> 
                            <label for="CONTRASENYA"><b>Contrasenya</b></label>
                            <input type="password" placeholder="Entra la teva contrasenya" name="CONTRASENYA" required/>
                        </div>
                        <button type="submit" value="submit" id="btnSubmit">SUBMIT <br>(Enviar)</button>

                        <label>
                            <input type="checkbox" checked="checked" name="RECORDAR-ME"/> Recordar-me
                        </label>
                    </div>
                    
                    <div class="fila" style="background-color:#f1f1f1">
                        <button type="reset" class="btnCancelar">Natejar camps!</button>
                        <span class="CONTRASENYA">Has perdut la teva <a href="#">contrasenya?</a></span>
                    </div>
                </form> 
            </div>
        </div>
    </main>
    <aside>BANNERS</aside>

    <footer>Fet per David</footer>

</body>
