<!DOCTYPE html>
<html lang="CA">
  <head id="previa">  <!-- <== "previa" = style.css, jquary, favicon, charset i responsive -->

    <script defer src="js/load_components.js"></script> <!-- <= inserció dels components/Snippets "id" -->
    <script defer src="js/signIn.js"></script> <!-- Validació del login (usuari i contrasenya) -->
    
</head>



<body id="body">
<header>
        <h1>~ ClassyGames ~</h1>
        <i class="fa-solid fa-hand-holding"></i>
        <i class="fa-solid fa-gamepad"></i>
</header>
    <nav>
        <div id="navMenu" style="display: none;">
        </div>
    </nav>
    <main>
        <!-- Contingut Principal -->
         <!-- Inici de sessió -->

         <div class="caixaLogin">
            <h2>Qui vols ser?</h2>
            <div>
                <i class="fa-regular fa-circle-user"></i>
                <i class="fa-regular fa-question"></i>
            </div>

            <h2>Registrar-se</h2>

            <form action="./login.html" method="post" onsubmit="return validaUsuariNou()">
            <table>
                <!-- Usuari i contrasenya: -->
                <tr>
                    <td>
                        <label for="username">Usuari:</label>
                    </td>
                    <td>
                        <input type="text" name="nom" id="username" required>
                    </td>
                    <td>
                        <div id="mUsername" class="alert"></div>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="password">Contrasenya:</label>
                    </td>
                    <td>               
                        <input type="password" name="nom" id="password" minlength="8" maxlength="24" required>
                    </td>
                    <td>
                        <div id="mPassword" class="alert"></div>
                    </td>
                    <!-- Email -->
                    <tr>
                    <td>
                        <label for="email">Email:</label>
                    </td>
                    <td>               
                        <input type="email" name="nom" id="email">
                    </td>
                    <td>
                        <div id="mEmail" class="alert"></div>
                    </td>
                </tr>
                </tr>
                <!-- Botóns del formulari: -->
                <tr>
                    <td>
                        <button id="btnRegistrarUsuari" type="submit">Registrar Usuari</button>     
                    </td>
                </tr>
                <!-- Mostrar errors o missatges aqui: -->
                <tr>
                    <td colspan="3" class="alert"><b id="missatgeValUsuari"></b></td>
                </tr>
            </table>
        </form>

         </div>

    </main>

    <aside></aside>

    <footer id="footer">
    </footer>
</body>
</html>
