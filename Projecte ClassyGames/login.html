<!doctype html>
<html lang="CA">
  <head id="previa">
    <!-- <== "previa" = style.css, jquary, favicon, charset i responsive -->

    <script defer src="js/load_components.js"></script>
    <!-- <= inserció dels components/Snippets "id" -->
    <script defer src="js/login.js"></script>
    <!-- Validació del login (usuari i contrasenya) -->
  </head>

  <body id="body">
    <header>
      <h1>~ ClassyGames ~</h1>
      <i class="fa-solid fa-hand-holding"></i>
      <i class="fa-solid fa-gamepad"></i>
    </header>
    <nav>
      <div id="navMenu" style="display: none"></div>
    </nav>
    <main>
      <!-- Contingut Principal -->
      <!-- Inici de sessió -->

      <div class="caixaLogin">
        <h2>Qui ets?</h2>
        <div>
          <i class="fa-regular fa-circle-user"></i>
          <i class="fa-regular fa-question"></i>
        </div>

        <h2>Inici de sessió</h2>

        <form action="./index.html" method="post" onsubmit="return validaIniciSessio();">
          <table>
            <!-- Usuari: -->
            <tr>
              <td>
                <label for="username">Usuari:</label>
              </td>
              <td>
                <input type="text" name="nom" id="username" />
              </td>
              <td>
                <div id="mUsername" class="alert"></div>
                <!-- <= Alerta del Username-->
              </td>
            </tr>
            <!-- Contrasenya: -->
            <tr>
              <td>
                <label for="password">Contrasenya:</label>
              </td>
              <td>
                <input type="password" name="nom" id="password" minlength="8" maxlength="24"/>
              </td>
              <td>
                <div id="mPassword" class="alert"></div>
                <!-- <= Alerta del Password-->
              </td>
            </tr>
            <!-- Botóns del formulari: -->
            <tr>
              <td>
                <button id="btnIniciSessio" type="submit">
                  Iniciar sessió
                </button>
              </td>
            </tr>
            <!-- Mostrar errors o missatges aqui: -->
            <tr>
              <td colspan="3" class="alert"><b id="missatgeValUsuari"></b></td>
            </tr>
          </table>
        </form>

        <!-- Envia formulari -->
        <form action="./signIn.html">
          <button type="submit"><b>No estas registrat? Fes-ho aquí!</b></button>
        </form>
      </div>
    </main>
    <aside></aside>
    <footer id="footer"></footer>
  </body>
</html>
