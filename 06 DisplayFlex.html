<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>06 DisplayFlex</title>

    <style>
        header, footer{
            text-align: center;
            background-color: black;
            color: wheat;
        }
        main{
            height: 500px;

            display: flex; /*"display: flex;" acomoda automàticament els continguts de la etiqueta*/

            flex-direction: row-reverse;  /*'row reverse' invirteix la direcció de la fila*/
        
            flex-wrap: wrap; /*Acomoda fent salt de linea cuan els continguts no caben en la mateixa linea*/
        
            justify-content:space-evenly; /*Fa espai entre els continguts*/

            align-items: center; /*centre els elements (altura)*/
        
        }
        .caixa{
            height: 100px;
            width: 100px;
            background-color: black;
            color: wheat;
            text-align: center;
            border: 4px solid purple;
            margin: 1px;
            text-shadow: 1px black;
            font-size: 20px;

            align-content: center; /*Alinea el text al centre (altura)*/

        }
        .vermell{
            background-color: red
        }
        .verd{
            background-color: green;
        }
        .blau{
            background-color: blue;
        }

    </style>
</head>

<body>
    <header>
    <h1>Example de display Flex (Flexbox)</h1>
    </header>
        <h1>MAIN</h1>
        
    <main>
        
        <div class="caixa vermell">Caixa1</div>
        <div class="caixa verd">Caixa2</div>
        <div class="caixa blau">Caixa3</div>
        <div class="caixa">Caixa4</div>

    </main>
    
    
    <footer><h2>Footer</h2></footer>
</body>
</html>
