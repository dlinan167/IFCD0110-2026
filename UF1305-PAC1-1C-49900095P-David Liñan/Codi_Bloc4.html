<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Detecció i correcció d’errors</title>
  </head>
  <body>
    <script>
        function escriu() {
            // Pinta de vermell el color de fons del cap "Nom usuari"
            usuari.style.backgroundColor = "red"; //Es pot modificar directament el '.style' referenciant el 'usuari'
        }
    </script>
    <form method="post" action="https://xavier.aymerich.cat/ifcd0110">
      <label for="usuari">Escriu el nom d’usuari: </label>
      <input type="text" id="usuari" name="usuari" onchange="escriu()" />
      <input type="submit" value="Enviar" />
    </form>
  </body>
</html>
