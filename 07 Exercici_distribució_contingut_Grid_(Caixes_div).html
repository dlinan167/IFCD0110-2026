<!DOCTYPE html>
<html lang="ES">
<head>
    <meta charset="UTF-8"/>

    <title>Example d'ús del Grid (Taula)</title>

    <style>
        /* "Header" i "Footer" amb mateix format (sense repetir codi) */
        
        header, footer{
            text-align: center;
        }
        /*Declarar etiquetes (Exp: "headerG")*/
        header{
            grid-area: headerG;
            background-color: gray;
            border: 8px solid;
        }
        .div-header{
            grid-area: headerG;
            background-color: gray;
            border: 8px solid;
        }


        main{
            display: grid;
            height: 650px;
            grid-area: mainG; 
            background-color: maroon;
            text-align: center;
            border: 8px solid;

        }
        .div-main{
            display: grid;
            height: 650px;
            grid-area: mainG; 
            background-color: maroon;
            text-align: center;
            border: 8px solid;

        }


        aside{
            grid-area:asideG; 
            background-color: green;
            text-align: center;
            border: 8px solid;
            
            /*style concret (sense CSS)*/

            float: right;
            width: 23%;
        }
        .div-aside{
            grid-area:asideG; 
            background-color: green;
            text-align: center;
            border: 8px solid;
            
            /*style concret (sense CSS)*/

            float: right;
            width: 23%;
        }


        footer{grid-area: footerG;
            background-color: blue;
            border: 8px solid;
        }

        .div-footer{grid-area: footerG;
            background-color: blue;
            border: 8px solid;
        }


        article{
            grid-area: sectionG;
            background-color: purple;
            color: wheat;
            text-align: center;
            border: 3px solid black;
            margin: 2%;
        }
        .div-article{
            grid-area: sectionG;
            background-color: purple;
            color: wheat;
            text-align: center;
            border: 3px solid black;
            margin: 2%;
        }


        .menu{
            grid-area: menuG;
            background-color: goldenrod;
            border: 5px solid;
            text-align: center;

            /*style concret (sense CSS)*/

            float: left;
            width: 23%;

        }

        /*Declarar etiquetes */

        /*grid Alternatiu*/
        .gridArticle{
            display: grid;
            /*Medida de columnes*/

            /*flex dels articles*/
            display: flex;
            flex-direction: row;
            justify-content: space-around;

        }

        .div-section{
            
            background-color: cyan;
            border: 4px solid black;
            margin: 2%;
            width: 40%; 

        }



        
    </style>
</head>


<body> <!--display grid en contenidor (body)-->

    <div class="div-header">
        <h1>Capçalera</h1>
    </div>

    <div class="menu">
        <h2>MENÚ</h2>
    </div>

    <div class="div-aside"> <h2>ASIDE</h2></div>

    <div class="div-main">
        <h1>Principal</h1>
        <!--Article amb grid-->

        <div class="gridArticle">
            <div class="div-section"> <!--Section 1-->
                <h2>Secció 1</h2>
                <div class="div-article"><h3>Article 1</h3></div>
                <div class="div-article"><h3>Article 2</h3></div>
                <h4>
                    
                </h4>
            </div>
            
            <div class="div-section"> <!--Section 2-->
                <h2>Secció 2</h2>
                <div class="div-article"><h3>Article 1</h3></div>
                <div class="div-article"><h3>Article 2</h3></div>
                <h4>
                    
                </h4>
            </div>
        </div>
            
           
    </div>
    

    <div class="div-footer"><h2>Peu</h2></div>

</body> <!--display grid en contenidor (body)-->
</html>
