<!doctype html>
<html lang="CA">
  <head>
    <div id="41 previa"></div>
  </head>
<body>
    <header>
      <div id="41 navbar-BOOT"></div>
    </header>
    <nav>
        <ul>
            <li>Opció 1</li>
            <li>Opció 2</li>
            <li>Opció 3</li>
            <li>Opció 4</li>
        </ul>
    </nav>
            <!-- ================ BOOTSTRAP: (MAIN) SIGN IN ==================== -->
    <main class="form-signin w-100 m-auto">
      <form>
        <img
          class="mb-4"
          src="https://cdn-icons-png.flaticon.com/512/5832/5832519.png"
          alt="Icona de diari"
          width="72"
          height="57"
        />
        <h1 class="h3 mb-3 fw-normal">Inicia sessió abans de contactar</h1>
        <div class="form-floating">
          <input
            type="email"
            class="form-control"
            id="floatingInput"
            placeholder="name@example.com"
          />
          <label for="floatingInput">Email address</label>
        </div>
        <div class="form-floating">
          <input
            type="password"
            class="form-control"
            id="floatingPassword"
            placeholder="Password"
          />
          <label for="floatingPassword">Password</label>
        </div>
        <div class="form-check text-start my-3">
          <input
            class="form-check-input"
            type="checkbox"
            value="remember-me"
            id="checkDefault"
          />
          <label class="form-check-label" for="checkDefault">
            Remember me
          </label>
        </div>
        <button class="btn btn-primary w-100 py-2" type="submit">
          Sign in
        </button>
        <p class="mt-5 mb-3 text-body-secondary">&copy; 2017–2025</p>
      </form>
    </main>
    <aside>
        <h2> BANNERS</h2>
    </aside>

    <footer>Fet per David</footer>

</body>
