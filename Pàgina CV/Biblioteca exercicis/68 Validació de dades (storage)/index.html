<body id="body">

        <select name="darktheme" id="tema">

     <main>

    <!-- Validació de dades (Utilitzant storage) -->
     <!-- USUARI I PASSWORD (INICI DE SESSIÓ) -->
    <h3>Validació d'Inici de Sessió:</h3>
            <div class="caixaValidar">
            <!-- <form action="" method="post"> -->

                <table>
                    <!-- Usuari i contrasenya: -->
                    <tr>
                        <td>
                            <label for="username">Usuari:</label>
                        </td>
                        <td>
                            <input type="text" name="nom" id="username">
                        </td>
                        <td>
                            <div id="mUsername" class="alert"></div>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="">Contrasenya:</label>
                        </td>
                        <td>               
                            <input type="password" name="nom" id="password" minlength="8" maxlength="24">
                        </td>
                        <td>
                            <div id="mPassword" class="alert"></div>
                        </td>
                    </tr>
                    <!-- Botóns del formulari: -->
                    <tr>
                        <td>
                            <button id="btnIniciSessio" type="submit">Inici sessió</button>     
                        </td>
                        <td>
                            <button id="btnNatejaDades">Nateja dades</button>     
                        </td>
                        <td>
                            <button id="btnNouUsuari">Registrar nou usuari</button>     
                        </td>
                    </tr>
                    <!-- Mostrar errors o missatges aqui: -->
                    <tr>
                        <td colspan="3" class="alert"><p><b id="missatgeValUsuari"></b></p></td>
                    </tr>
                </table>
            </div>
        <!-- </form> -->
        <!--  -->

        <!-- -+-+-+-+-+-+-+ PROVA TEST DE MÈTODE checkValidity() -+-+-+-+-+-+-+-+-+-+- -->
         <!-- valida 1 -->
         <b>EXEMPLE: checkValidity()</b>
        <input id="id1" type="number" min="100" max="300" required>
        <button onclick="valida()">Executar Validació</button>
        <p id="demo"></p>
        <!-- valida 2 -->
        <b>EXEMPLE: .validity.rangeOverflow</b>
        <input id="id2" type="number" max="100" required>
        <button onclick="valida2()">Executar Validació</button>
        <p id="demo2"></p>
        <!-- valida 3 -->
        <b>EXEMPLE: pattern</b>
        <input id="id3" type="text" pattern="[a-z]+">
        <button onclick="valida3()">Executar Validació</button>
        <p id="demo3"></p>

        <script>
            // 
        function valida() {
            const inpObj1 = document.getElementById("id1");   // <= id Input
            console.log(inpObj1.checkValidity());            // <= Retorna un boolean true o false basant-se en si compleix o no la validació
            if (!inpObj1.checkValidity()) {                  // <= checkValidity [fa una validació bàsica com el els limits min.100-300.max que ja té el input]
                document.getElementById("demo").innerHTML = inpObj1.validationMessage; // <= El missatge automàtic [Depend del navegador i del idioma del PC] (Es pot customitzar)
            } else 
                document.getElementById("demo").innerHTML = "Input OK";
            }
            // range overflow
            function valida2() {
                const num2 = document.getElementById("id2");
                let text2 = "Value OK";
                if (num2.validity.rangeOverflow) {
                    text2 = "T'has pasat del límit (Value too large)";
                }
                document.getElementById("demo2").innerHTML = text2;
            }
            // pattern
            function valida3() {
                const pattern = document.getElementById("id3");
                console.log(pattern.checkValidity());
            }
            </script>


    
</main>
