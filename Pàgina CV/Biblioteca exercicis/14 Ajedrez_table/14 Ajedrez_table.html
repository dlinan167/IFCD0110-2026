        main{

        /* table, tr, td{
            border: 5px solid;

        } */

        /* Cambia el color por hijo(child) de tr de las filas pares(even) / effecto rayas de zebra */
        td{
            height: 50px;
            width: 50px;
        }
  

        /* Files negres(pars) amb celes negres en (Impars) */
        tr:nth-child(odd), td:nth-child(even){
            background-color: black;
            color: white;

            /* Celes pars blanques */
            td:nth-child(even){
                background-color: white;
                color: black;
            } 
        }
