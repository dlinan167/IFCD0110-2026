<body id="body" onload="obrirModal()">
    <header>
        <!--  -->
        <h1>// 70 Finestra Modal</h1>
    </header>
        
    <nav></nav>

    <main>
    <!--  -->
    <label for="">Clicka el botó</label>
    <p>(- Al clickar s'obra una finestra emergent amb els elements que nosaltres programem -)</p>
    <button id="btnObrir" onclick="obrirModal()">Boto de OBRIR Finestra Modal</button>
    <p>---</p>
    <button id="btnTancar" onclick="tancarModal()">Boto de TANCAR Finestra Modal</button>
    <p></p>
    <p></p>
    <p></p>
    <p></p>
    <p>AMB onclick="myDialog.showModal()":</p>
    <button id="btnObrir" onclick="myDialog.showModal()">Boto de OBRIR Finestra Modal</button>
    <p>---</p>
    <p>AMB onclick="myDialog.close()":</p>
    <button id="btnTancar" onclick="myDialog.close()">Boto de TANCAR Finestra Modal</button>

    <!-- En la etiqueta dialogue que té el estat 'open' (false/true), podem afegir qualsevol cosa dintre -->
    <dialog id="myDialog">
        <h3>
            Aixó es una finestra modal oberta!
        </h3>
        <button id="btnTancar" onclick="tancarModal()">Boto de TANCAR Finestra Modal</button>
    </dialog>
    
    <div class="cargant">
       <h3>Cargant...</h3>
    </div>
    </main>
