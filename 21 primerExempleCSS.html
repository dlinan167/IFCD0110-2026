    <link rel="stylesheet" href="./21 primerExempleCSS.css"/> <!-- < < < Primer CSS -->

    <style>
        header{
            background-color: red;
            position: fixed;
            z-index: 1; /*< < < Per donar posició a un element fixe i que es pugui veure per sobre de altres elements que el trepitgen*/
        }
        /* Alternativa */
        /* header{
            background-color: red;
            position: fixed;
            top: 0;
                        i el header al final
            } */
        main{
            top: 44px;
        }
        ul{

        }
        .llista-fruites{
            list-style-type: circle;
        }
        #cotxes{   /*< < < style amb id, NO ES RECOMENABLE per que utilitza id, solament per coses molt específiques*/
            list-style-type: disc;
        }
    </style>

    <!-- <<< ORDRE DE PRIORITAT DELS ESTILS: >>>
          1er: style Inline
          2on: Etiqueta style
          3er: Arxiu enllçat CSS        -->
  </head>
